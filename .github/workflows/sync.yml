name: Sync official Lark suite skill

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official-lark-suite
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @larksuite/cli@latest
      - run: npm run sync
      - run: npm test
      - run: npm run check
      - id: changes
        run: |
          if git diff --quiet -- skills sync-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-lark-suite
          base: master
          commit-message: "chore(skills): sync official lark suite"
          title: "chore(skills): sync official lark suite"
          body: |
            Regenerated with the latest `@larksuite/cli` using `lark-cli update --skills-layout suite` in an isolated HOME.

            The generated skill is validated with `npm test` and `npm run check`.
